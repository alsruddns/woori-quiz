server {
  listen 80;
  server_name _;
  location ^~ /quiz-assets/ { proxy_pass http://quiz:3005/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /quiz-sitemap.xml { proxy_pass http://quiz:3005/quiz-sitemap.xml; }
  location ~ ^/[a-z]{2}(-[a-z]{2})?/quiz(/.*)?$ { proxy_pass http://quiz:3005; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location ~ ^/quiz/(ko|en|ja|zh|es|pt-br|de|fr|vi|id|th|zh-tw|it|nl|hi)(/quiz/[^/]+)?$ { proxy_pass http://quiz:3005; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
