server {
  listen 80;
  server_name _;
  location = /quiz-sitemap.xml { proxy_pass http://quiz:3005/quiz/quiz-sitemap.xml; }
  location /quiz/ { proxy_pass http://quiz:3005/quiz/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
